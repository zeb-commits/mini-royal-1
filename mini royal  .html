<body>
<canvas id="c" tabindex="0" aria-label="Zone de jeu Mini Royale"></canvas><canvas id="c3" tabindex="0" aria-label="Rendu 3D Mini Royale"></canvas>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<div id="hud"><div class="chip">👥 <b id="alive">12</b></div><div class="chip">🎯 <b id="kills">0</b></div><div class="chip">🪵 <b id="mats">60</b></div><div class="chip" id="spchip"></div></div>
<div id="toast" class="chip"></div><div id="bars"><div id="hint"></div><div id="inv"></div><div class="bar"><i id="sh" style="background:var(--sh)"></i></div><div class="bar"><i id="hp" style="background:var(--hp)"></i></div></div>
<div id="codebox" class="chip"></div><div id="ov"><div class="card">
<h1>Mini Royale</h1>
<div class="xp"><i id="xpbar"></i></div><div style="font-size:13px"><span id="sname">Saison 1 : Aurores</span> · <span id="tier"></span></div>
<div class="tabs" id="tabs"><button data-tab="play">⚔ Jouer</button><button data-tab="locker">🎒 Casier</button><button data-tab="pass">🏆 Pass</button><button data-tab="friends">👥 Amis</button></div>
<div id="pane"></div>
<button id="go">Jouer</button>
<small>Jeu original fait avec Claude, sans lien avec Fortnite ni Epic Games.</small>
</div></div>
<script>
const $=id=>document.getElementById(id),cv=$('c'),ctx=cv.getContext('2d');
const WORLD=12800,CELL=40,N=320,MID=6400;
const RAR=[['Commun','#e4e4e4',1],['Rare','#3b9cff',1.2],['Épique','#b050ff',1.45],['Légendaire','#ff9b1f',1.75],['Mythique','#ffe23a',2.1],['Exotique','#2de2d0',2.5]];
const WP={pi:{n:'Pistolet',d:14,cd:.35,sp:700,sg:.05,p:1,life:1},ar:{n:'Fusil d’assaut',d:17,cd:.13,sp:760,sg:.08,p:1,life:1.1},sg:{n:'Fusil à pompe',d:10,cd:.85,sp:650,sg:.28,p:6,life:.35},rl:{n:'Lance-roquettes',d:60,cd:1.5,sp:430,sg:.02,p:1,life:2,boom:110},gl:{n:'Lance-grenades',d:45,cd:.9,sp:360,sg:.03,p:1,life:.85,boom:90,gr:1},sn:{n:'Fusil de précision',d:48,cd:1.15,sp:1100,sg:.006,p:1,life:1.8},sx:{n:'Fusil de précision lourd',d:68,cd:1.35,sp:1250,sg:.003,p:1,life:2.1},se:{n:'Fusil de précision exotique',d:82,cd:1.0,sp:1350,sg:.002,p:1,life:2.2}};
const SPR=[['Klombo','🦖','Crée du butin à chaque niveau (monte en te soignant)','dino',0x4cc35a],['Quack','🦆','Partage 50 % de son XP avec tes autres esprits','duck',0xffd23a],['Jackrabbit','🐇','Esprit collectionneur (pas de pouvoir de base)','rabbit',0xd9d2c5],['Killswitch','🤖','Esprit collectionneur (pas de pouvoir de base)','robot',0x39404d],['X-Ray','🩻','Esprit collectionneur (pas de pouvoir de base)','robot',0x7fe3ff],['Overshield','🛡️','Esprit collectionneur (pas de pouvoir de base)','shield',0x3b9cff],['Onigiri','🍙','Esprit collectionneur (pas de pouvoir de base)','onigiri',0xf4f4ee],['Crown','👑','Esprit collectionneur (pas de pouvoir de base)','crown',0xffc400],['Birthday','🎂','Esprit collectionneur (pas de pouvoir de base)','cake',0xff8fc7],['Storm Scout','⛈️','Esprit collectionneur (pas de pouvoir de base)','cloud',0x9aa6c8]];
const VAR=[['Normal','#ffffff','Pouvoir de base'],['Doré','#ffd24a','XP des éliminations ×3'],['Cheat Master','#a855f7','Tous les codes sont réussis'],['Loot Hacker','#22c55e','20 % de chances d’un butin plus rare'],['Bounty Hunter','#ef4444','+25 PV à chaque élimination']];
const ALLC=SPR.flatMap((o,i)=>VAR.map((q,v)=>i+':'+v));
const SK=[{n:'Classique',c:'#3b82f6',a:'#1e3a8a',t:0},{n:'Rouge',c:'#dc2626',a:'#450a0a',t:1},{n:'Ninja',c:'#262626',a:'#e11d48',t:4},{n:'Astro',c:'#e8e8f0',a:'#38bdf8',t:7},{n:'Doré',c:'#e6b422',a:'#fff3a0',t:10},{n:'Renard cyber',c:'#f97316',a:'#7c2d12',t:2},{n:'Gardien polaire',c:'#a5f3fc',a:'#155e75',t:4},{n:'Ombre spectrale',c:'#7c3aed',a:'#1e1b4b',t:6},{n:'Chevalier néon',c:'#ec4899',a:'#4a044e',t:8},{n:'Mécha titan',c:'#94a3b8',a:'#334155',t:12},{n:'Dragon écarlate',c:'#ef4444',a:'#450a0a',t:5},{n:'Astronaute lunaire',c:'#e2e8f0',a:'#475569',t:9}];
const PK=[{n:'Pioche de base',c:'#9ca3af',t:0},{n:'Pioche Cuivre',c:'#c2703d',t:2},{n:'Pioche Or',c:'#facc15',t:5},{n:'Pioche Cristal',c:'#67e8f9',t:8},{n:'Pioche Cyber',c:'#f0abfc',t:11},{n:'Griffe de loup',c:'#d1d5db',t:3},{n:'Marteau Klombo',c:'#fb923c',t:6},{n:'Lame galaxie',c:'#818cf8',t:9},{n:'Trident des abysses',c:'#22d3ee',t:12},{n:'Hache de glace',c:'#bae6fd',t:4},{n:'Faux spectrale',c:'#c084fc',t:8}];
const PT=[{n:'Aucun',e:'',t:0},{n:'Poussin',e:'🐥',t:3},{n:'Renardeau',e:'🦊',t:6},{n:'Slime',e:'🟢',t:9},{n:'Dragonnet',e:'🐲',t:12},{n:'Klombo miniature',e:'🦕',t:5},{n:'Loup des neiges',e:'🐺',t:7},{n:'Mini phénix',e:'🐦‍🔥',t:10},{n:'Axolotl cosmique',e:'🦎',t:11}];
let SV={xp:0,sk:0,pk:0,pt:0,es:'0:0',col:['0:0','1:0'],sx:{},ext:{},fr:[]};
try{Object.assign(SV,JSON.parse(localStorage.getItem('mr2')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('mr2',JSON.stringify(SV))}catch(e){}};

let W=0,H=0,walls,houses,bullets,parts,fx,loot,player,bots,pet,t,kills,running=false,last=0,buildCd=0,aim=false,mapOpen=false,tt=0,inj=[],chests=[],code=null;
const mouse={x:0,y:0,down:false},keys={};
function resize(){const d=devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',resize);

const rnd=n=>Math.random()*n|0;
function rollR(){const f=()=>{let r=Math.random()*100,s=0;for(let i=0;i<6;i++){s+=[40,26,16,10,5,3][i];if(r<s)return i}return 0};return f()}
function overlaps(x,y,r){for(let gy=Math.floor((y-r)/CELL);gy<=Math.floor((y+r)/CELL);gy++)for(let gx=Math.floor((x-r)/CELL);gx<=Math.floor((x+r)/CELL);gx++)if(walls.has(gy*N+gx))return true;return false}
function circleRect(e,gx,gy,pad){const cx=Math.max(gx*CELL,Math.min(e.x,gx*CELL+CELL)),cy=Math.max(gy*CELL,Math.min(e.y,gy*CELL+CELL));return Math.hypot(e.x-cx,e.y-cy)<e.r+(pad||0)}
function mk(bot,x,y){const s=bot?{c:'hsl('+rnd(360)+',65%,50%)',a:'hsl('+rnd(360)+',40%,20%)'}:SK[SV.sk];const pk=bot?'#9ca3af':PK[SV.pk].c;
  return{x,y,r:14,hp:bot?80:100,sh:0,ang:0,cd:0,bot,dead:false,hit:0,st:0,sd:1,sl:[null,null,null,null],cur:0,pot:0,kit:0,mats:60,c:s.c,a:s.a,pk}}
function spawn(avoid){for(let i=0;i<300;i++){const x=80+Math.random()*(WORLD-160),y=80+Math.random()*(WORLD-160);if(overlaps(x,y,24))continue;if(avoid&&Math.hypot(x-avoid.x,y-avoid.y)<700)continue;return{x,y}}return{x:MID,y:MID}}
function drop(x,y,o){loot.push(Object.assign({x,y},o))}
function randLoot(x,y){const q=Math.random();if(q<.2)drop(x,y,{k:'pot'});else if(q<.35)drop(x,y,{k:'kit'});else drop(x,y,{k:'w',w:['pi','ar','ar','sg','sg','rl','gl','sn','sx','se'][rnd(10)],r:rollR()})}

function init(){
  walls=new Map();houses=[];towns=Array.from({length:18},()=>({x:700+Math.random()*(WORLD-1400),y:700+Math.random()*(WORLD-1400)}));bullets=[];parts=[];fx=[];loot=[];chests=[];kills=0;t=0;mapOpen=false;inj=[];code=null;$('codebox').style.display='none';clear3();
  for(let i=0,tries=0;i<420&&tries<6000;tries++){
    const roll=Math.random(),kind=roll<.055?'skyscraper':roll<.25?'apartment':roll<.39?'cabin':'house';
    const w=kind==='skyscraper'?9+rnd(5):5+rnd(4),h=kind==='skyscraper'?9+rnd(5):5+rnd(4),hp=hpos(w,h),gx=hp[0],gy=hp[1];
    if(houses.some(o=>gx<o.gx+o.w+2&&gx+w+2>o.gx&&gy<o.gy+o.h+2&&gy+h+2>o.gy))continue;
    const door=rnd(4),style=rnd(5),floors=kind==='skyscraper'?5+rnd(4):kind==='apartment'?2:(Math.random()<.28?2:1);houses.push({gx,gy,w,h,door,doorOpen:false,style,kind,floors});i++;

  const knob=new THREE.Mesh(new THREE.SphereGeometry(1.3,8,6),mat(0xd6ad53,.35));knob.position.set(doorW-4,doorH*.48,2);door.add(knob);
  g.door=hinge;g.houseData=h;g.doorTarget=0;g.userData.doorX=side<2?cx:doorLine;g.userData.doorZ=side<2?doorLine:cz;return g
}
function doorNear(){let best=null,bd=68;for(const [h,g] of hm){const d=Math.hypot(player.x-g.userData.doorX,player.y-g.userData.doorZ);if(d<bd){best=g;bd=d}}return best}
function mkChestAt(q){const m=mkChest();m.position.set(q.x,0,q.y);if(q.open)m.lid.rotation.x=-1.8;q.m=m;return m}
function mkInj(q){const c=RAR[q.r][1],m=new THREE.Mesh(new THREE.BoxGeometry(26,16,4),new THREE.MeshLambertMaterial({color:q.used?0x444444:c,emissive:q.used?0:c,emissiveIntensity:.4}));m.position.set(q.x,18,q.y-6);q.m=m;q.off=q.used?1:0;return m}
function mkLoot(o){return mkItem(o,o.k=='w'?RAR[o.r][1]:o.k=='s'?VAR[o.v][1]:o.k=='pot'?'#2f8cff':'#ff5a5a')}
function draw3(){

  for(const q of chests)if(q.open&&q.m&&q.m.lid.rotation.x>-1.8)q.m.lid.rotation.x-=.15;

  const gx0=Math.max(0,Math.floor((px-RD)/CELL)),gx1=Math.min(N-1,Math.floor((px+RD)/CELL)),gy0=Math.max(0,Math.floor((py-RD)/CELL)),gy1=Math.min(N-1,Math.floor((py+RD)/CELL));
  for(let gy=gy0;gy<=gy1;gy++)for(let gx=gx0;gx<=gx1;gx++){const k=gy*N+gx,w=walls.get(k);if(!w)continue;let m=wm.get(k);if(!m){m=new THREE.Mesh(wGeo,w.own?wMat.o:wMat.h);m.position.set(gx*CELL+20,0,gy*CELL+20);world.add(m);wm.set(k,m)}m.scale.y=.55+.45*w.hp/w.max;m.position.y=WH*m.scale.y/2}
  for(const [k,m] of wm){if(!walls.has(k)||Math.abs((k%N)*CELL-px)>RD+250||Math.abs(((k/N)|0)*CELL-py)>RD+250){world.remove(m);wm.delete(k)}}
  for(const [o,m] of lm){m.position.set(o.x,12+Math.sin(tt*3+o.x)*3,o.y);m.rotation.y=tt*2}
  for(const [h,g] of hm){const ins=px>h.gx*CELL&&px<(h.gx+h.w)*CELL&&py>h.gy*CELL&&py<(h.gy+h.h)*CELL;g.roof.material.transparent=ins;g.roof.material.opacity=ins?.12:1;g.door.rotation.y+=(g.doorTarget-g.door.rotation.y)*.18}
  for(let i=0;i<bullets.length;i++){const b=bullets[i];let m=BP[i];if(!m){m=BP[i]=new THREE.Mesh(sph,new THREE.MeshBasicMaterial({color:0xffe04a,fog:false}));sc3.add(m)}m.visible=true;m.material.color.set(b.boom?'#ff7a1a':b.c);m.scale.setScalar(b.boom?2:1);m.position.set(b.x,38,b.y)}
  for(let i=bullets.length;i<BP.length;i++)BP[i].visible=false;
  const np=Math.min(parts.length,150);for(let i=0;i<np;i++){const p=parts[i];let m=PP[i];if(!m){m=PP[i]=new THREE.Mesh(pbox,new THREE.MeshBasicMaterial({color:0xffffff}));sc3.add(m)}m.visible=true;m.material.color.set(p.c);m.position.set(p.x,10+p.life*30,p.y)}
  for(let i=np;i<PP.length;i++)PP[i].visible=false;
  for(let i=0;i<fx.length;i++){const f=fx[i];let m=FP[i];if(!m){m=FP[i]=new THREE.Mesh(sph,new THREE.MeshBasicMaterial({color:0xffb347,transparent:true}));sc3.add(m)}m.visible=true;m.material.opacity=Math.min(1,f.life*2.2);m.scale.setScalar(f.r*(1.4-f.life)/3.2);m.position.set(f.x,20,f.y)}

  storm3.scale.set(R,1,R);storm3.position.set(MID,250,MID);ring3.scale.set(R,R,1);ring3.position.set(MID,2,MID);
  cam3.aspect=W/H;cam3.updateProjectionMatrix();const camDist=aim?235:330,camHeight=aim?205:270;cam3.position.set(px-Math.cos(player.ang)*camDist,camHeight,py-Math.sin(player.ang)*camDist);cam3.lookAt(px,30,py);
  refreshSp();

    const mv=m.lx===undefined?0:Math.hypot(e.x-m.lx,e.y-m.ly);m.lx=e.x;m.ly=e.y;m.ph+=mv*.14;const am=Math.min(1,mv/2.5)*.9;

    const w=e.sl[e.cur],gk=w?w.w+w.r:'';if(m.gk!==gk){m.gk=gk;if(m.gm)m.body.remove(m.gm);if(w){m.gm=mkGun(w.w,RAR[w.r][1]);m.gm.rotation.y=-1.5708;m.gm.position.set(6,40,17);m.gm.scale.setScalar(1.15);m.body.add(m.gm)}}

  drawWeaponReticle();
  R3.render(sc3,cam3)}

  if(tab=='pass'){h='<div class="lobby-main"><div class="lobby-kicker">PASS GRATUIT · NOUVEAU CHAQUE MOIS</div><h2>'+pass.label+'</h2><p>Récompenses de '+pass.title+'. Gagne de l’XP en jouant pour débloquer les 12 paliers. Le thème et les récompenses tournent automatiquement chaque mois.</p><div class="lobby-pills"><span class="lobby-pill">🎁 Gratuit</span><span class="lobby-pill">📅 '+pass.title+'</span><span class="lobby-pill">⭐ '+SV.xp+' XP</span></div></div><h3>Récompenses du mois</h3>';for(let i=1;i<=12;i++){const idx=(i+pass.month-1)%12;const arrs=[['Skin',SK],['Pioche',PK],['Compagnon',PT],['Skin',SK],['Pioche',PK]];const [n,a]=arrs[(i+pass.month)%arrs.length];const x=a.find(o=>o.t===(idx%12)+1)||a[(idx)%a.length];h+='<div class="row'+(i<=tier?' got':'')+'"><span>Palier '+i+(i<=tier?' ✓':'')+'</span><span>'+(x?(n+' : '+x.n):'Récompense surprise')+(i>tier?' · '+(i*100)+' XP':'')+'</span></div>'}}
